<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodingCamp | 7 September 2026 | Eko Susanto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header Section -->
        <header class="card header-card">
            <!-- Theme Toggle (Challenge 1) -->
            <button type="button" id="theme-toggle" class="theme-btn" aria-label="Toggle dark mode">🌙 Dark Mode</button>
            <time id="clock">10:45:22</time>
            <time id="date">Tuesday, January 27, 2026</time>
            <div class="greeting-container">
                <h1 id="greeting">Good Morning</h1>
                <div class="name-section">
                    <input type="text" id="name-input" placeholder="Enter your name..." aria-label="Your name" style="display: none;">
                    <span id="display-name" title="Click to edit name" role="button" tabindex="0"></span>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="grid-container">
            <!-- Focus Timer Card (Challenge 3) -->
            <section class="card timer-card" aria-labelledby="timer-heading">
                <h2 id="timer-heading">Focus Timer</h2>
                <div id="timer-display" role="timer" aria-live="polite">25:00</div>
                <div class="timer-settings">
                    <label for="pomodoro-time">Minutes:</label>
                    <input type="number" id="pomodoro-time" value="25" min="1" max="120">
                    <button type="button" id="set-time-btn">Set</button>
                </div>
                <div class="button-group" role="group" aria-label="Timer controls">
                    <button type="button" id="start-btn">Start</button>
                    <button type="button" id="stop-btn">Stop</button>
                    <button type="button" id="reset-btn">Reset</button>
                </div>
            </section>

            <!-- Tasks Card (Challenges 4 & 5) -->
            <section class="card tasks-card" aria-labelledby="tasks-heading">
                <h2 id="tasks-heading">Tasks</h2>
                <div class="task-input-group">
                    <input type="text" id="task-input" placeholder="Add a new task..." aria-label="New task">
                    <button type="button" id="add-task-btn">Add</button>
                </div>
                <div class="task-controls">
                    <label for="sort-tasks">Sort by:</label>
                    <select id="sort-tasks" aria-label="Sort tasks">
                        <option value="default">Default</option>
                        <option value="alphabetical">Alphabetical</option>
                        <option value="status">Status (Active first)</option>
                    </select>
                </div>
                <ul id="task-list" aria-label="Task list"></ul>
            </section>

            <!-- Quick Links Card -->
            <section class="card links-card" aria-labelledby="links-heading">
                <h2 id="links-heading">Quick Links</h2>
                <div class="link-input-group">
                    <input type="text" id="link-name" placeholder="Link name" aria-label="Link name">
                    <input type="url" id="link-url" placeholder="URL (https://...)" aria-label="Link URL">
                    <button type="button" id="add-link-btn">Add Link</button>
                </div>
                <nav id="links-container" class="links-container" aria-label="Quick links"></nav>
            </section>
        </main>

        <!-- Footer Section -->
        <footer class="dashboard-footer">
            <p>&copy; 2026 Eko Susanto &bull; Coding Camp Software Engineering RevoU</p>
        </footer>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
