<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Camp Sofware Engineering RevoU</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-indigo-500 to-purple-600 dark:from-gray-900 dark:to-gray-800 min-h-screen text-gray-800 dark:text-gray-100 p-4 md:p-6 transition-colors duration-300">
    <div class="max-w-4xl mx-auto relative">
        <!-- Theme Toggle (Challenge 1) -->
        <button id="theme-toggle" class="absolute top-0 right-0 px-4 py-2 bg-white/80 dark:bg-gray-800/80 border border-gray-300 dark:border-gray-700 rounded-lg font-semibold shadow-sm hover:bg-white dark:hover:bg-gray-700 transition">
            🌙 Dark Mode
        </button>

        <!-- Header Section -->
        <header class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl p-6 md:p-8 shadow-md mb-6 text-center mt-12 md:mt-0">
            <div id="clock" class="text-3xl md:text-5xl font-bold tracking-wider mb-1">10:45:22</div>
            <div id="date" class="text-base opacity-80 mb-3">Tuesday, January 27, 2026</div>
            <div class="flex flex-col sm:flex-row justify-center items-center gap-2">
                <h2 id="greeting" class="text-2xl font-bold">Good Morning</h2>
                <div class="text-xl">
                    <input type="text" id="name-input" placeholder="Enter your name..." class="px-2 py-1 border border-gray-300 dark:border-gray-600 rounded bg-transparent text-gray-800 dark:text-gray-100 text-lg hidden">
                    <span id="display-name" class="cursor-pointer font-bold underline decoration-dotted" title="Click to edit name"></span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Focus Timer Card (Challenge 3) -->
            <div class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl p-6 shadow-md text-center flex flex-col justify-between">
                <div>
                    <h3 class="text-xl font-bold mb-3">Focus Timer</h3>
                    <div id="timer-display" class="text-5xl font-bold my-4">25:00</div>
                    <div class="flex justify-center items-center gap-2 mb-4 text-sm">
                        <label for="pomodoro-time">Minutes:</label>
                        <input type="number" id="pomodoro-time" value="25" min="1" max="120" class="w-16 px-2 py-1 text-center border border-gray-300 dark:border-gray-600 rounded bg-transparent">
                        <button id="set-time-btn" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded shadow transition">Set</button>
                    </div>
                </div>
                <div class="flex justify-center gap-3">
                    <button id="start-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow transition">Start</button>
                    <button id="stop-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow transition">Stop</button>
                    <button id="reset-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow transition">Reset</button>
                </div>
            </div>

            <!-- Tasks Card (Challenges 4 & 5) -->
            <div class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl p-6 shadow-md flex flex-col">
                <h3 class="text-xl font-bold mb-3">Tasks</h3>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="task-input" placeholder="Add a new task..." class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-transparent text-gray-800 dark:text-gray-100">
                    <button id="add-task-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow transition">Add</button>
                </div>
                <div class="flex items-center gap-2 mb-3 text-sm">
                    <label for="sort-tasks">Sort by:</label>
                    <select id="sort-tasks" class="px-2 py-1 border border-gray-300 dark:border-gray-600 rounded bg-transparent text-gray-800 dark:text-gray-100">
                        <option value="default" class="dark:bg-gray-800">Default</option>
                        <option value="alphabetical" class="dark:bg-gray-800">Alphabetical</option>
                        <option value="status" class="dark:bg-gray-800">Status (Active first)</option>
                    </select>
                </div>
                <ul id="task-list" class="space-y-2 max-h-48 overflow-y-auto pr-1"></ul>
            </div>

            <!-- Quick Links Card -->
            <div class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl p-6 shadow-md md:col-span-2">
                <h3 class="text-xl font-bold mb-3">Quick Links</h3>
                <div class="flex flex-col sm:flex-row gap-2 mb-4">
                    <input type="text" id="link-name" placeholder="Link name" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-transparent text-gray-800 dark:text-gray-100">
                    <input type="text" id="link-url" placeholder="URL (https://...)" class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-transparent text-gray-800 dark:text-gray-100">
                    <button id="add-link-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow transition">Add Link</button>
                </div>
                <div id="links-container" class="flex flex-wrap gap-3"></div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
