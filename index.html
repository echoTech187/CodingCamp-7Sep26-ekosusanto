<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodingCamp | 7 September 2026 | Eko Susanto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        

        <!-- Header Section -->
        <header class="card header-card">
            <!-- Theme Toggle (Challenge 1) -->
            <button id="theme-toggle" class="theme-btn">🌙 Dark Mode</button>
            <div id="clock">10:45:22</div>
            <div id="date">Tuesday, January 27, 2026</div>
            <div class="greeting-container">
                <h2 id="greeting">Good Morning</h2>
                <div class="name-section">
                    <input type="text" id="name-input" placeholder="Enter your name..." style="display: none;">
                    <span id="display-name" title="Click to edit name"></span>
                </div>
            </div>
        </header>

        <div class="grid-container">
            <!-- Focus Timer Card (Challenge 3) -->
            <div class="card timer-card">
                <h3>Focus Timer</h3>
                <div id="timer-display">25:00</div>
                <div class="timer-settings">
                    <label for="pomodoro-time">Minutes:</label>
                    <input type="number" id="pomodoro-time" value="25" min="1" max="120">
                    <button id="set-time-btn">Set</button>
                </div>
                <div class="button-group">
                    <button id="start-btn">Start</button>
                    <button id="stop-btn">Stop</button>
                    <button id="reset-btn">Reset</button>
                </div>
            </div>

            <!-- Tasks Card (Challenges 4 & 5) -->
            <div class="card tasks-card">
                <h3>Tasks</h3>
                <div class="task-input-group">
                    <input type="text" id="task-input" placeholder="Add a new task...">
                    <button id="add-task-btn">Add</button>
                </div>
                <div class="task-controls">
                    <label for="sort-tasks">Sort by:</label>
                    <select id="sort-tasks">
                        <option value="default">Default</option>
                        <option value="alphabetical">Alphabetical</option>
                        <option value="status">Status (Active first)</option>
                    </select>
                </div>
                <ul id="task-list"></ul>
            </div>

            <!-- Quick Links Card -->
            <div class="card links-card">
                <h3>Quick Links</h3>
                <div class="link-input-group">
                    <input type="text" id="link-name" placeholder="Link name">
                    <input type="text" id="link-url" placeholder="URL (https://...)">
                    <button id="add-link-btn">Add Link</button>
                </div>
                <div id="links-container" class="links-container"></div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
